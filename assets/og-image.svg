<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="12%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#FF7A6B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF7A6B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="88%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#78AAFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#78AAFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#FF7A6B"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <mask id="gridmask">
      <radialGradient id="gm" cx="50%" cy="50%" r="70%">
        <stop offset="0%" stop-color="#fff"/>
        <stop offset="100%" stop-color="#000"/>
      </radialGradient>
      <rect width="1200" height="630" fill="url(#gm)"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="#08080B"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridmask)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="80" y="80" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#9A9AA8" letter-spacing="3">AVAILABLE FOR NEW PROJECTS � 2026</text>

    <text x="80" y="310" font-size="150" font-weight="500" fill="#ECECF1" letter-spacing="-6">Ambru</text>
    <text x="80" y="440" font-size="95" font-weight="500" fill="#9A9AA8" letter-spacing="-4">Cosmin <tspan font-style="italic" font-weight="400" fill="url(#accent)">Claudiu</tspan></text>

    <text x="80" y="530" font-size="26" font-family="'Inter Tight', system-ui, sans-serif" fill="#9A9AA8" letter-spacing="-0.5">I design websites and build the automations behind them.</text>

    <text x="80" y="580" font-size="16" font-family="ui-monospace, Menlo, monospace" fill="#7A7A88" letter-spacing="1">ambru<tspan fill="#A78BFA">.cc</tspan> &#8212; web design &amp; AI automation</text>
  </g>
</svg>
